<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>og</title>
<style>
/* The share card for the sell page: 1200x630, rendered by og.mjs into
   sell/public/og.png. Same tokens and faces as the page (paper theme), so a
   link unfurled on LinkedIn or Reddit looks like the page it opens. Fonts
   resolve relative to this file, as reel.css does. */
@font-face { font-family: Archivo; src: url(../src/fonts/Archivo-normal-300_700.woff2) format('woff2'); font-weight: 300 700; }
@font-face { font-family: Literata; src: url(../src/fonts/Literata-normal-200_900.woff2) format('woff2'); font-weight: 200 900; }
@font-face { font-family: 'IBM Plex Mono'; src: url(../src/fonts/IBMPlexMono-normal-400.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'IBM Plex Mono'; src: url(../src/fonts/IBMPlexMono-normal-600.woff2) format('woff2'); font-weight: 600; }
:root { --paper:#fff; --panel-2:#eaeaea; --ink:#0a0a0a; --ink-2:#4a4a4a; --ink-3:#6b6b6b;
        --line:#d6d6d6; --line-strong:#8a8a8a; --accent:#ff5c00; --accent-ink:#b83c00;
        --accent-soft:#ffede3; --on-accent:#0a0a0a; }
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1200px; height:630px; overflow:hidden; background:var(--paper); color:var(--ink);
       font-family: Archivo, system-ui, sans-serif; position:relative; }
.top { position:absolute; left:64px; right:64px; top:56px; display:flex; align-items:center; }
.brand { font-weight:700; font-size:30px; letter-spacing:-.02em; display:inline-flex; align-items:center; }
.brand .mk { background:var(--accent); color:var(--on-accent); padding:5px 11px; margin-right:11px; }
.eyebrow { margin-left:auto; font:600 19px/1 'IBM Plex Mono',monospace; letter-spacing:.12em; text-transform:lowercase; color:var(--accent-ink); }
h1 { position:absolute; left:64px; top:150px; width:760px; font-weight:700; font-size:70px; line-height:1.02;
     letter-spacing:-.03em; text-wrap:balance; }
.dg { position:absolute; right:64px; top:150px; width:300px; }
.termbar { position:absolute; left:64px; right:64px; bottom:56px; display:flex; border:1px solid var(--line-strong); }
.termbar div { flex:1; padding:16px 22px 18px; border-right:1px solid var(--line-strong); }
.termbar div:last-child { border-right:0; }
.termbar b { display:block; font-size:34px; font-weight:700; letter-spacing:-.025em; line-height:1.1; font-variant-numeric:tabular-nums; }
.termbar span { font:400 15px/1 'IBM Plex Mono',monospace; letter-spacing:.1em; text-transform:lowercase; color:var(--ink-3); display:block; margin-top:8px; }
.dgNode { fill:var(--panel-2); stroke:var(--ink-2); stroke-width:1.5; }
.dgNodeAlt { fill:var(--accent-soft); stroke:var(--accent); stroke-width:2; }
.dgEdge { stroke:var(--ink-3); stroke-width:1.6; fill:none; }
.dgTxt { fill:var(--ink); font:600 15px 'IBM Plex Mono',monospace; }
.dgTxtS { fill:var(--ink-3); font:400 12px 'IBM Plex Mono',monospace; }
</style>
<body>
  <div class="top">
    <span class="brand"><span class="mk">HLD</span>Gym</span>
    <span class="eyebrow">30-day system design sprint · presale</span>
  </div>
  <h1 id="h1">You can read system design for months and still freeze at the whiteboard.</h1>
  <svg class="dg" viewBox="0 0 280 300" aria-hidden="true">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
      </marker>
    </defs>
    <rect class="dgNode" x="0" y="12" width="80" height="40"/>
    <text class="dgTxt" x="40" y="37" text-anchor="middle">App</text>
    <rect class="dgNodeAlt" x="100" y="12" width="80" height="40"/>
    <text class="dgTxt" x="140" y="37" text-anchor="middle">Cache</text>
    <rect class="dgNode" x="200" y="12" width="80" height="40"/>
    <text class="dgTxt" x="240" y="37" text-anchor="middle">DB</text>
    <line class="dgEdge" x1="40" y1="52" x2="40" y2="290"/>
    <line class="dgEdge" x1="140" y1="52" x2="140" y2="290"/>
    <line class="dgEdge" x1="240" y1="52" x2="240" y2="290"/>
    <line class="dgEdge" x1="40" y1="96" x2="136" y2="96" marker-end="url(#arrow)"/>
    <text class="dgTxtS" x="48" y="90">1. GET</text>
    <line class="dgEdge" x1="136" y1="138" x2="44" y2="138" marker-end="url(#arrow)"/>
    <text class="dgTxtS" x="48" y="132">2. miss</text>
    <line class="dgEdge" x1="40" y1="180" x2="236" y2="180" marker-end="url(#arrow)"/>
    <text class="dgTxtS" x="48" y="174">3. query</text>
    <line class="dgEdge" x1="236" y1="222" x2="44" y2="222" marker-end="url(#arrow)"/>
    <text class="dgTxtS" x="48" y="216">4. rows</text>
    <line class="dgEdge" x1="40" y1="264" x2="136" y2="264" marker-end="url(#arrow)"/>
    <text class="dgTxtS" x="48" y="258">5. SET, ttl</text>
  </svg>
  <div class="termbar">
    <div><b>$19</b><span>one time</span></div>
    <div><b>197 reps</b><span>one per diagram</span></div>
    <div><b>1 Sep</b><span>start date</span></div>
    <div><b>51 chapters</b><span>free, no signup</span></div>
  </div>
</body>
</html>
