<script>
(function(){
  var t = null;
  try { t = JSON.parse(localStorage.getItem('hldgym_v1')||'{}').theme || null; } catch(e){}
  if (['light','dark','manim'].indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
