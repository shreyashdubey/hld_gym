<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<!-- The book is the distribution, so it is the half of the site worth ranking:
     51 chapters of the exact phrases people search for. It shipped with a bare
     <title> and nothing else until 2026-08-17. -->
<meta name="description" content="{{PAGE_DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
<meta property="og:type" content="book">
<meta property="og:site_name" content="HLD Gym">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="https://hld-gym.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<!-- Two values, because the book follows the OS until the reader picks a theme.
     One would tint the browser chrome the wrong way for half of them. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0d0d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23FF5C00'/><text x='50' y='50' font-family='Helvetica,Arial,sans-serif' font-size='62' font-weight='600' fill='%23fff' text-anchor='middle' dominant-baseline='central'>h</text></svg>">
<script>
(function(){
  var t = null;
  try { t = JSON.parse(localStorage.getItem('hldgym_v1')||'{}').theme || null; } catch(e){}
  if (['light','dark','manim','phosphor'].indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
/*{{FONTS_CSS}}*/
</style>
<style>
/*{{STYLE_CSS}}*/
</style>
</head>
<body data-mode="origins">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
</svg>

<a class="skip-link" href="#view">skip to the chapter</a>

<header class="topbar">
  <div class="topbar-inner">
    <button id="nav-toggle" class="icon-btn named" aria-label="Open chapters"><span class="ib-g">☰</span><span class="ib-n" id="crumb"></span></button>
    <a class="brand" href="/"><span class="brand-mark">HLD</span> Gym</a>
    <span id="time-left"></span>
    <span class="topbar-spacer"></span>
    <span id="streak-pill" class="pill" title="Current streak"></span>
    <button id="text-size" class="icon-btn named" data-level="0"><span class="ib-g ts-mark">aA</span><span class="ib-n">normal</span></button>
    <button id="theme-toggle" class="icon-btn named" aria-label="Switch theme"><span class="ib-g">◐</span><span class="ib-n">paper</span></button>
  </div>
  <div id="read-progress" aria-hidden="true"><i></i></div>
</header>

<div class="shell">
  <nav id="sidebar" class="sidebar" aria-label="Chapters"></nav>
  <div id="scrim" class="scrim" hidden></div>
  <main id="view" class="view" tabindex="-1"></main>
  <aside id="rail" class="rail" aria-label="On this page"></aside>
</div>

<!-- ===== image credits =====
     Generated by build.py's credits_html() from the merged
     src/assets/*.manifest.json, so it cannot drift from what actually shipped.
     Nothing below is hand-written and nothing here should be: add a row to a
     manifest, point a chapter figure or a card at the file, and the entry
     appears with the counts recomputed. It replaced a hand-typed block whose
     every number was already a number somebody had to remember to update.
     A mode that ships no image files renders nothing at all here - that is
     /book, which copies no assets directory, and an empty credits table on a
     page with no images is a claim about images that are not there.
     This is also the only place in either output where a source link can live:
     validate_html bans every https:// URL inside a chapter fragment, and this
     block sits outside the fragments. -->
<!--{{CREDITS}}-->

<div id="toast-root" aria-live="polite"></div>

<!--{{CHAPTER_TEMPLATES}}-->

<script type="application/json" id="toc-data">/*{{TOC_JSON}}*/</script>
<script type="application/json" id="quiz-data">/*{{QUIZ_JSON}}*/</script>
<script type="application/json" id="cards-data">/*{{CARDS_JSON}}*/</script>
<script>
/*{{APP_JS}}*/
</script>
</body>
</html>
