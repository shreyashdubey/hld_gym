<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The book's mark, identical: src/template.html carries this same square as
       a data URI. Both halves of the site sit at one origin now, so a tab on /
       and a tab on /book must not show different icons.

       White on the orange rather than the near-black the header chip uses. That
       rule is a contrast rule, and contrast rules govern text; this is a 16px
       mark, and matching the book matters more than matching the chip.

       Note for anyone editing this comment: XML forbids a double hyphen inside
       a comment, so token names cannot be written here in their CSS form. Doing
       that makes the whole file a parse error, and a broken SVG favicon fails
       silently as the browser's default page icon. -->
  <rect width="100" height="100" fill="#FF5C00"/>
  <text x="50" y="50" font-family="Helvetica,Arial,sans-serif" font-size="62"
        font-weight="600" fill="#fff" text-anchor="middle"
        dominant-baseline="central">h</text>
</svg>
