  --panel: #FFFFFF;
  --ink: #1B2A41;
  --ink-2: #46586F;
  --ink-3: #77879C;
  --line: #D8E0E9;
  --grid: rgba(47, 109, 224, 0.055);
  --accent: #2F6DE0;
  --accent-ink: #1D4DA8;
  --accent-soft: #E5EDFB;
  --good: #1F9D63;
  --good-soft: #E1F3EA;
  --bad: #CE4444;
  --bad-soft: #FAE8E8;
  --warm: #A96F1F;
  --warm-soft: #F6EEDC;
  --stamp: #C2453A;
  --shadow: 0 1px 2px rgba(27, 42, 65, .06), 0 4px 16px rgba(27, 42, 65, .07);
  --h0: #E9EFF7; --h1: #C4D7F2; --h2: #8FB3E8; --h3: #5488DB; --h4: #2F5FBB;
}
[data-theme="dark"] {
  --paper: #0E1C2E;
  --panel: #152A44;
  --ink: #DCE6F2;
  --ink-2: #A9BCD3;
  --ink-3: #7C92AD;
  --line: #294564;
  --grid: rgba(110, 168, 255, 0.06);
  --accent: #6EA8FF;
  --accent-ink: #9CC2FF;
  --accent-soft: #1C3557;
  --good: #4CC08A;
  --good-soft: #143424;
  --bad: #E4756B;
  --bad-soft: #3B1E1D;
  --warm: #D9A05B;
  --warm-soft: #34290F;
  --stamp: #E4756B;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .35);
  --h0: #1A3050; --h1: #24466F; --h2: #35619A; --h3: #4E82C7; --h4: #74A7EF;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font-family: "Literata", Charter, Georgia, serif;
  font-size: 17px;
  line-height: 1.72;
}
:is(button, a):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

.mono, .box-tag, .eyebrow, .pill, .q-level-tab, .stamp, .tile-label, .tile-value, .btn, code, pre {
  font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}

/* ---------- chrome ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1.05rem; letter-spacing: .01em; }
.brand-mark {
  font-family: "IBM Plex Mono", monospace; font-weight: 600; color: var(--accent);
  border: 1.5px solid var(--accent); border-radius: 6px; padding: 1px 6px; margin-right: 2px; font-size: .9em;
}
.topbar-spacer { flex: 1; }
.icon-btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; width: 36px; height: 36px; font-size: 1rem; cursor: pointer;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.pill {
  font-size: .72rem; color: var(--ink-2); border: 1px solid var(--line);
  background: var(--panel); border-radius: 999px; padding: 4px 10px;
}
.pill b { color: var(--warm); }

.shell { display: flex; min-height: calc(100vh - 57px); }

/* ---------- sidebar ---------- */
.sidebar {
  width: 300px; flex: none;
  border-right: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 60%, var(--paper));
  padding: 18px 14px 40px;
  overflow-y: auto;
  position: sticky; top: 57px; height: calc(100vh - 57px);
}
.side-part { margin: 14px 0 4px; }
.side-part-title {
  font-family: "IBM Plex Mono", monospace; font-size: .68rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); margin: 0 8px 6px;
  display: flex; align-items: baseline; gap: 8px;
}
.side-part-title .prog { margin-left: auto; letter-spacing: 0; color: var(--ink-3); }
.side-ch {
  display: flex; align-items: center; gap: 8px;

<p>Picture this. You walk into a room (or a Zoom call). A stranger smiles, says hi, and gives you one sentence: <em>"Design Instagram."</em> Then they lean back and wait.</p>

<p>Forty-five minutes. One vague sentence. And on the other side of that conversation: a level, an offer, maybe a life-changing amount of money. The strange part? The interviewer is not really testing whether you can design Instagram. Nobody builds Instagram in 45 minutes. They're testing something else entirely — and most candidates never figure out what.</p>

<p>This chapter is the answer key. Before you learn a single thing about caching or sharding, you're going to learn what this exam actually grades. Study the exam before the subject — it changes how you learn everything that follows.</p>

<h2>What the interviewer is actually doing</h2>

<p>The interviewer sits there with a mental scorecard, not a checklist of technologies. Across companies the scorecard looks remarkably similar. They're asking themselves:</p>

<ul>
<li><strong>Can this person take something vague and make it concrete?</strong> Real work never arrives as a clean spec. "Design Instagram" is fuzzy on purpose.</li>
<li><strong>Do they make decisions, or list options?</strong> Engineers who own systems commit: "I'll use Postgres here, because…" Engineers who read blog posts recite: "We could use SQL or NoSQL, both have trade-offs…"</li>
<li><strong>Do they find the hard part?</strong> Every system has one or two genuinely hard problems buried in a pile of easy ones. Spotting the hard part fast is a senior skill.</li>
<li><strong>Have they felt production?</strong> People who've been paged at 3am design differently. It shows in small ways: they mention monitoring, they ask what happens when a node dies, they distrust anything with a single point of failure.</li>
</ul>

<div class="box analogy"><div class="box-tag">Analogy</div>
<p>A system design interview is a driving test, not a written exam. The examiner doesn't care whether you can recite the manual — they care whether you check the mirror before changing lanes, without being told. Naming ten databases is reciting the manual. Saying "I'll put a queue here, because this write path will spike at 9pm and I don't want the database taking that punch directly" — that's checking the mirror.</p>
</div>

<h2>The shape of a good 45 minutes</h2>

<p>Nearly every strong interview follows the same skeleton. Learn it like a song structure — verse, chorus, verse. You'll practice it so many times in this book that it becomes muscle memory.</p>

<figcaption>The 45-minute skeleton. The last block decides your level.</figcaption>

<h3>1. Requirements (~5 min): shrink the problem</h3>

<p>"Design Instagram" is a trap if you take it literally. Instagram is fifty products in a trench coat. Your first job is to shrink it, out loud, with the interviewer's agreement: "I'll focus on photo upload and the home feed. Stories, DMs, and Reels are out of scope — fair?"</p>

<p>Split what remains into two lists. <strong>Functional requirements</strong> — what the system does: upload a photo, follow people, see a feed. <strong>Non-functional requirements</strong> — the qualities it must have: feed loads in under 200 milliseconds, survives a machine dying, handles 500 million users. Non-functional requirements are where design decisions come from. A feed for 500 users and a feed for 500 million users are different machines that happen to share a name.</p>

<h3>2. Estimation (~5 min): get numbers that change your design</h3>

<p>Back-of-envelope math has one purpose, and it isn't impressing anyone with arithmetic. The numbers must <em>drive decisions</em>. If your estimate doesn't change what you build, skip it — that's the senior move.</p>

<p>"500 million users, maybe 100 million daily. Each opens the feed a few times a day — call it 5. That's 500 million feed loads a day, roughly 6,000 per second on average, so plan for 20,000 at peak. Writes? Maybe 100 million new photos a day, about 1,200 per second. So this system is enormously read-heavy — reads outnumber writes maybe 20 to 1. <em>That</em> ratio is why I'll design the read path first, and why caching will carry this whole system."</p>

<p>See what happened? The math produced a conclusion, and the conclusion shaped the architecture. That's the whole game. Chapter 1.4 drills this until it's reflex.</p>

<h3>3. API and data model (~5 min): draw the contract</h3>

<p>A handful of endpoints and the core tables/entities. <code>POST /photos</code>, <code>GET /feed?cursor=…</code>. A <code>users</code> table, a <code>photos</code> table, a <code>follows</code> table. Don't gold-plate this part — its job is to prove you can turn requirements into concrete shapes, then get out of the way.</p>

<h3>4. High-level design (~10 min): the complete machine</h3>

<p>Boxes and arrows: clients, load balancer, app servers, database, cache, queue, storage. Here is the single most important rule at every level: <strong>finish the loop</strong>. A request must be traceable from the user's thumb all the way in (write path) and all the way back out (read path). The most common failure in these interviews — documented over thousands of real sessions — isn't a lack of depth. It's never finishing a working design. An incomplete brilliant design loses to a complete boring one, every time.</p>

<h3>5. Deep dives (~15–20 min): where the level is decided</h3>

<p>Everything before this was the qualifying lap. Now the interviewer picks a box on your whiteboard and says "tell me more" — or, if you're playing at the senior level, <em>you</em> pick the box before they ask. This is the part of the interview that separates levels, and it deserves its own section.</p>

<h2>The crux: every problem has a hard part</h2>

<div class="box crux"><div class="box-tag">The crux</div>
<p>In every design problem, most of the system is routine — CRUD endpoints, a load balancer, a database. And then there's one part that's <em>actually hard</em>, the part the question was invented to probe. For a URL shortener, it's ID generation without collisions. For a chat app, it's message ordering and delivery guarantees. For a news feed, it's fanning out posts from accounts with 100 million followers. Finding the crux fast — and saying it out loud: "the interesting problem here is X, I want to spend most of our time there" — is the single strongest senior signal that exists. Every problem chapter in Part 3 stamps its crux exactly like this box, until spotting them becomes instinct.</p>
</div>

<div class="box analogy"><div class="box-tag">Analogy</div>
<p>A design problem is like a house tour where one room is on fire. Junior candidates tour every room with equal enthusiasm, describing the curtains. Senior candidates smell smoke, walk straight to the burning room, and start talking about how to put it out. The interviewer already knows which room is on fire — they lit it. They're waiting to see how long you take to notice.</p>
</div>

<h2>Mid-level pass vs senior pass: the same answer, graded twice</h2>

<p>Here's the uncomfortable truth from people who've sat on both sides of the table: a complete, sensible high-level design with reasonable trade-offs is a <em>strong pass</em> for a mid-level candidate — and the same performance gets marked "lacking depth" for a senior. The delta isn't knowledge. It's behavior.</p>

<table>
<thead><tr><th>Dimension</th><th>Mid-level (E4 / L4)</th><th>Senior (E5 / L5)</th></tr></thead>
<tbody>
<tr><td>Who drives</td><td>Covers requirements and the high-level design, then lets the interviewer steer the deep dives</td><td>Drives all 45 minutes; proposes their own deep-dive agenda: "I want to dig into the fanout path next"</td></tr>
<tr><td>Trade-offs</td><td>Discusses options when asked</td><td>Commits with justification: "Postgres, because I need transactions here and it won't be the bottleneck" — then names the cost of that choice</td></tr>
<tr><td>Depth</td><td>Solid breadth; textbook understanding is acceptable</td><td>Goes deep on 2–3 components without being asked, with specifics: what's cached, what happens on a miss, what happens when the cache dies</td></tr>
<tr><td>Failure</td><td>Handles failures when prompted</td><td>Raises them first: "What happens at 10x load? When this region dies? Who gets paged?"</td></tr>
<tr><td>Numbers</td><td>Forgiven for rough estimation</td><td>Estimation is non-negotiable, and each number must earn its place by changing the design</td></tr>
</tbody>
</table>

<p>Read the second column again. Nothing in it requires knowing more facts. It requires <em>owning the room</em>: proposing, committing, self-critiquing. That's trainable, and it's precisely what the Level 3 quizzes in every chapter train — they put you in a scenario and make you choose like an owner, then explain why hedging reads junior.</p>

<div class="box story"><div class="box-tag">War story — the question that gets redesigned three times</div>
<p>A candidate interviewing for a senior role at Meta described their design round like this: the interviewer kept asking one question, over and over — "and what if you had 100 times more users?" Each time, part of the design melted. A single database became sharded. A simple fanout hit a celebrity account and had to become a hybrid push-pull system. The candidate redesigned their sharding strategy three times in one interview. That wasn't the interview going badly — that <em>was</em> the interview. Meta's design rounds deliberately push a working design until it breaks, because how you respond to your own design breaking is the senior signal. Expect it, and you can even enjoy it: when your design breaks, say "good — here's what breaks first, and here's the fix," and you're demonstrating exactly what they came to see.</p>
</div>

<h2>Operational maturity: design something you'd be on call for</h2>

<p>This is the newest and least-prepared-for part of the senior bar. Interviewers increasingly grade whether you think past the launch: How do you know the system is healthy? What do you watch — latency, error rate, queue depth? How do you roll out a change without betting the company on it? How do you roll back? What does the 3am page look like, and what did you build so it never fires?</p>

<p>One retelling from a failed senior loop puts it perfectly: "You never said monitoring, deployment, or rollback. You never walked through what happens at 3am. That gap alone can sink an otherwise strong performance." The fix costs thirty seconds: end every design with what you'd monitor and how you'd ship it. We'll build this habit in Part 2 (observability, rollouts) until it's automatic.</p>

<h2>The seven ways strong candidates fail</h2>

<p>Thousands of post-mortems from real loops boil down to a short list. Pin it somewhere.</p>

<ul>
<li><strong>Never finishing.</strong> Beautiful deep dive, incomplete system. Complete beats clever.</li>
<li><strong>Waiting to be led.</strong> Correct answers, delivered passively, read as mid-level.</li>
<li><strong>Option-listing.</strong> "We could do A or B or C…" with no commitment reads as no judgment.</li>
<li><strong>Buzzword architecture.</strong> Kafka, Redis, and "multi-region" in the first ten minutes, before any traffic numbers exist to justify them.</li>
<li><strong>Happy-path-only.</strong> No failure modes, no monitoring — tells the interviewer you've never been on call.</li>
<li><strong>Over-engineering.</strong> Distributed search for ten thousand rarely-updated records. Simplicity, justified, reads senior; complexity, unjustified, reads insecure.</li>
<li><strong>Fighting the hints.</strong> Interviewers steer you away from dead ends on purpose. Ignoring the steer loses the collaboration points.</li>
</ul>

<div class="box lens"><div class="box-tag">At the whiteboard</div>
<p>How this chapter's material actually surfaces in a real round — the meta-questions behind every question:</p>
<ul>
<li>"Design X" (vague on purpose) — they're grading how you scope before they grade what you build.</li>
<li>"How many servers would this need?" — they're checking whether your numbers connect to your design or float free of it.</li>
<li>"What would you improve with another week?" — they're checking whether you can critique your own design, a pure senior signal.</li>
<li>"What breaks first if traffic goes 10x?" — they want you to have known the answer <em>before</em> they asked.</li>
</ul>
</div>

<div class="feynman" data-key="p0c01-f1">
<p class="fey-prompt">Explain to a junior engineer, in five or six sentences, what a system design interview actually measures — and why "knowing lots of technologies" isn't it.</p>
<details class="fey-model"><summary>Compare with a model answer</summary>
<p>It measures judgment, not vocabulary. The interviewer gives you a vague problem and watches whether you can make it concrete: narrow the scope, put numbers on the load, and design a complete machine that a request can actually travel through. Then they watch what you do with the hard part — every problem has one genuinely difficult piece, and finding it yourself is worth more than knowing extra tools. Committing to choices and explaining why beats listing every alternative, because that's what owning a real system looks like. And they listen for signs you've lived with software in production: what you'd monitor, what breaks under load, what the failure plan is. A candidate with fewer facts and real judgment beats a walking encyclopedia every time.</p>
</details>
</div>

<h2>Exercises</h2>

<div class="exercise">
<div class="ex-q"><p>Take "Design WhatsApp" and do <em>only</em> the first five minutes: write functional requirements (pick 3–4, cut the rest out loud) and non-functional requirements (with numbers you invent but justify). Time yourself. Five minutes, no more.</p></div>
<details><summary>Answer</summary><p>One good shape: functional — 1:1 messages, delivery/read receipts, online status; out of scope — groups, calls, stories, encryption details. Non-functional — messages delivered in under a second when both users are online; no message ever lost once the server accepts it (that acceptance acknowledgment is a promise); 1 billion users, 50 billion messages/day ≈ 600K messages/sec average, plan for 1.5M/sec peak; chat history available on a new device. Notice how each non-functional line implies architecture: "never lost" means durable storage before acknowledging, "under a second" means persistent connections, not polling.</p></details>
</div>

<div class="exercise">
<div class="ex-q"><p>For each system, name the crux in one sentence: (a) a URL shortener, (b) a ticket-booking site the day Coldplay tickets drop, (c) a Google Docs clone.</p></div>
<details><summary>Answer</summary><p>(a) Generating billions of short, unique IDs fast, without two servers ever producing the same one. (b) Thousands of people buying the <em>same seat</em> in the same second — concurrency and overselling, not traffic volume, is the fire. (c) Two people typing in the same paragraph at the same time — merging concurrent edits so every copy converges to the same result. If you found these in under a minute each, you're already thinking like the interviewer.</p></details>
</div>

<div class="exercise">
<div class="ex-q"><p>Rewrite this option-listing answer as a committing answer: "For the feed we could use push, where we write to every follower's feed at post time, or pull, where we build the feed at read time. Push is faster to read but expensive for popular accounts. Pull is cheaper to write but slower to read. Both are valid."</p></div>
<details><summary>Answer</summary><p>Something like: "I'll use push — write each new post into followers' cached feeds at post time — because feeds are read 20 times more often than they're written, so I want reads to be a cheap cache hit. The cost is that a celebrity with 100M followers triggers 100M writes, so for accounts above roughly a million followers I'll flip to pull and merge their posts in at read time. Push by default, pull for celebrities." Same facts, plus a decision, a reason tied to the read/write ratio, an honest cost, and a mitigation. That's the difference between a book report and a design.</p></details>
</div>

<div class="takeaways"><div class="box-tag">Takeaways</div>
<ul>
<li>The interview grades judgment under vagueness, not technology trivia.</li>
<li>Follow the skeleton: requirements → estimation → API/data → complete high-level design → deep dives → ops wrap-up.</li>
<li>A complete boring design beats an incomplete brilliant one — always finish the loop.</li>
<li>Estimation only counts when the numbers change the design.</li>
<li>Every problem has a crux; find it fast, announce it, spend your time there.</li>
<li>Senior = drive the room, commit with reasons, go deep 2–3 times unprompted, raise failure modes first.</li>
<li>End every design with monitoring and rollout — design something you'd be on call for.</li>
</ul>
</div>

<script type="application/json" id="quiz-data">{"p0c01": [{"id": "p0c01-q01", "level": 1, "type": "mcq", "tag": "requirements", "q": "What's the difference between functional and non-functional requirements?", "options": [{"t": "Functional = what the system does; non-functional = the qualities it must have (speed, scale, reliability)", "correct": true, "why": "Right. 'Upload a photo' is functional. 'Feed loads in under 200ms for 100M daily users' is non-functional \u2014 and it's the non-functional list that actually shapes the architecture."}, {"t": "Functional = backend features; non-functional = frontend features", "correct": false, "why": "Nothing to do with frontend vs backend. Both lists describe the whole system \u2014 one says what it does, the other says how well it must do it."}, {"t": "Functional = required features; non-functional = optional nice-to-haves", "correct": false, "why": "Tempting, because 'non-functional' sounds like 'not needed.' It's the opposite \u2014 'never lose a message' is non-functional and utterly mandatory."}, {"t": "They're two names for the same list", "correct": false, "why": "They're different lists with different jobs. Mixing them up means your design decisions have nothing to hang on \u2014 scale targets live in the non-functional list."}]}, {"id": "p0c01-q02", "level": 1, "type": "mcq", "tag": "structure", "q": "In the 45-minute skeleton, which phase most strongly decides whether you're graded senior?", "options": [{"t": "The deep dives", "correct": true, "why": "Yes. Requirements through high-level design qualify you; the 15-20 minutes of deep dives \u2014 chosen by you, unprompted \u2014 decide the level. 'The deep dive is what separates L5 from L4.'"}, {"t": "The requirements phase", "correct": false, "why": "Scoping well matters and sloppy scoping hurts, but everyone competent does requirements. It's table stakes, not the differentiator."}, {"t": "The API design", "correct": false, "why": "The API section should be quick achine or absent judgment."}, {"t": "Making the design too simple", "correct": false, "why": "Justified simplicity reads senior. Over-engineering is the failure mode on this axis, not simplicity."}, {"t": "Spending too long on requirements", "correct": false, "why": "Pacing errors happen, but they're a symptom. The fatal outcome they cause is the real #1: an unfinished design."}]}, {"id": "p0c01-q05", "level": 1, "type": "mcq", "tag": "estimation", "q": "What makes a back-of-envelope estimate 'good' in an interview?", "options": [{"t": "It changes a design decision", "correct": true, "why": "Yes. '20:1 read-to-write ratio, so I design the read path first and lean on caching' \u2014 the number produced a conclusion. Math that changes nothing is filler, and seniors skip it."}, {"t": "It's accurate to two decimal places", "correct": false, "why": "Nobody cares about precision. Orders of magnitude and round numbers are expected; the grading is on whether the number connects to the design."}, {"t": "It uses impressive-sounding units", "correct": false, "why": "Petabytes-dropping without consequences reads as theater. A humble 'about 6K QPS, so one beefy database can't take this alone' beats it every time."}, {"t": "It's done silently to save time", "correct": false, "why": "Silent math earns zero credit \u2014 the reasoning out loud IS the deliverable. The interviewer grades the connection between number and decision."}]}, {"id": "p0c01-q06", "level": 1, "type": "mcq", "tag": "ops", "q": "'Design a system you'd want to be on call for' is shorthand for:", "options": [{"t": "Including monitoring, rollout/rollback, and failure handling in your design", "correct": true, "why": "Right. Operational maturity \u2014 what you watch, how you ship changes safely, what happens at 3am \u2014 is now explicitly graded at senior, not a staff-level bonus."}, {"t": "Designing systems that never fail", "correct": false, "why": "Impossible, and claiming it is a red flag. The graded skill is designing for failure: detect it, contain it, recover from it."}, {"t": "Choosing boring technologies only", "correct": false, "why": "Boring tech is often wise, but that's a different principle. On-call readiness is about observability and failure plans, whatever the stack."}, {"t": "Adding more redundancy everywhere", "correct": false, "why": "Redundancy without measurement is just expensive hope. You can't be paged for \u2014 or debug \u2014 what you can't see; monitoring comes first."}]}, {"id": "p0c01-q07", "level": 1, "type": "mcq", "tag": "senior-bar", "q": "Which behavior most clearly reads as mid-level rather than senior, even when the answers are technically correct?", "options": [{"t": "Waiting for the interviewer to choose what to explore deeply", "correct": true, "why": "Yes \u2014 passivity is the tell. 'If you're looking to your interviewer for guidance about how to proceed, you're losing points.' Seniors propose their own deep-dive agenda."}, {"t": "Asking clarifying questions about scope", "correct": false, "why": "That's expected at every level \u2014 scoping questions early are a strength, not passivity."}, {"t": "Admitting you don't know something", "correct": false, "why": "Honest gaps, flagged and routed around, read as maturity. Bluffing is what kills."}, {"t": "Using simple technology choices", "correct": false, "why": "Simple, justified choices read senior. 'Postgres, because it won't be the bottleneck and I get transactions' is a strong answer."}]}, {"id": "p0c01-q08", "level": 1, "type": "mcq", "tag": "structure", "q": "Why should you state your scope out loud ('feed and upload; DMs out of scope \u2014 fair?') instead of just starting?", "options": [{"t": "It turns a vague prompt into an agreed contract and shows you shape ambiguity", "correct": true, "why": "Right. The vagueness is the test. Negotiating scope out loud is the graded skill \u2014 and it protects you from spending 45 minutes on the part they didn't care about."}, {"t": "It fills time while you think", "correct": false, "why": "It does buy thinking time, but that's a side effect. Treating it as filler misses that scoping is itself being graded."}, {"t": "It's a politeness ritual interviewers expect", "correct": false, "why": "Not politeness \u2014 engineering. Real projects die from unscoped ambiguity, and the interview is a compressed simulation of exactly that."}, {"t": "It prevents the interviewer from changing the question later", "correct": false, "why": "They can and will move the goalposts anyway ('now 100x the users') \u2014 that's deliberate. Scope agreement starts the game; it doesn't freeze it."}]}, {"id": "p0c01-q09", "level": 2, "type": "mcq", "tag": "senior-bar", "q": "Interviewer: 'SQL or NoSQL for the user profiles?' Which reply reads most senior?", "options": [{"t": "\"Postgres. Profiles are small, relational, and read-mostly \u2014 one primary with read replicas covers this for years. If profile reads ever dominate, I'd add a cache before I'd switch databases.\"", "correct": true, "why": "Commitment, a reason tied to the workload, a growth path, and a named alternative you consciously deferred. That's the full senior package in three sentences."}, {"t": "\"Both are viable. SQL gives ACID and joins; NoSQL gives horizontal scale and flexible schemas. It depends on the requirements.\"", "correct": false, "why": "Everything here is true, and it commits to nothing. This is the option-listing pattern that explicitly reads as lacking judgment \u2014 'it depends' with no decision is a non-answer."}, {"t": "\"NoSQL \u2014 it scales better, and at these companies everything needs to scale.\"", "correct": false, "why": "A commitment, but justified by vibes. Profile data at this size doesn't need horizontal scale on day one, and 'everything must scale' is the buzzword-architecture tell."}, {"t": "\"Whichever the team already runs \u2014 operational familiarity beats theoretical fit.\"", "correct": false, "why": "There's real wisdom in this line for actual jobs, but in the interview it dodges the design question being asked. Use the reasoning \u2014 then still make the call on the merits."}]}, {"id": "p0c01-q10", "level": 2, "type": "mcq", "tag": "pacing", "q": "Twenty minutes in, you're still perfecting the API section of your Instagram design. What's the senior move?", "options": [{"t": "Cut it short: sketch the remaining flow end-to-end fast, then spend saved time deep-diving the feed path", "correct": true, "why": "Yes. Complete-then-deep is the winning shape. The API section can't earn you the level, but a missing end-to-end design can absolutely lose it."}, {"t": "Finish the API properly \u2014 quality over coverage", "correct": false, "why": "This is how strong engineers fail: polishing a low-signal section while the clock eats the deep dives. 'Never finished' is the #1 documented failure."}, {"t": "Ask the interviewer whether they'd like more API detail", "correct": false, "why": "Occasionally checking in is fine, but outsourcing your pacing decision is the waiting-to-be-led pattern. Own the clock."}, {"t": "Skip the high-level diagram and jump straight to a deep dive to save time", "correct": false, "why": "Deep-diving a component of a system that doesn't exist yet on the board leaves the interviewer with no complete machine to grade. Finish the loop first, however roughly."}]}, {"id": "p0c01-q11", "level": 2, "type": "mcq", "tag": "estimation", "q": "You estimate a service at 300 requests/sec average. The senior follow-through is:", "options": [{"t": "\"Peak maybe 1K/sec \u2014 a couple of app servers and one Postgres handle this. So scale isn't the interesting problem here; correctness is where I'll spend time.\"", "correct": true, "why": "The number produced a conclusion \u2014 this system is small, so stop designing for imaginary scale and find the real crux. Estimation that redirects your attention is estimation doing its job."}, {"t": "\"So we'll need Kafka and horizontal sharding to be safe.\"", "correct": false, "why": "300/sec needs none of that. Deploying big-scale machinery against small numbers is over-engineering \u2014 and it signals your estimates don't connect to your decisions."}, {"t": "Round it to 1M/sec to be conservative", "correct": false, "why": "A 1000x 'safety margin' isn't conservative, it's abandoning the estimate. Design for realistic peak with headroom, and say what you'd change if you were wrong by 10x."}, {"t": "Note it and move on to the architecture", "correct": false, "why": "An estimate that changes nothing was filler. The whole point of the number is the sentence after it \u2014 what it means for the design."}]}, {"id": "p0c01-q12", "level": 2, "type": "mcq", "tag": "crux", "q": "You're asked to design a ticket-booking system. Which observation shows you've found the crux?", "options": [{"t": "\"The hard part is thousands of people grabbing the same seat in the same second \u2014 I need to make sure we never sell one seat twice, and that's where I'll focus.\"", "correct": true, "why": "That's the fire. Concurrency on identical hot rows \u2014 not raw traffic \u2014 is what ticket-booking questions exist to probe. Announcing it and steering there is the senior pattern."}, {"t": "\"This needs a CDN for the event pages and posters.\"", "correct": false, "why": "True and trivial \u2014 static content is a solved, routine problem. Touring the room with curtains while the seat-selling room burns."}, {"t": "\"We should support many payment providers.\"", "correct": false, "why": "A product feature, not a design challenge. Integration breadth isn't what the question is probing."}, {"t": "\"The database needs an index on event_id for fast lookups.\"", "correct": false, "why": "Correct and routine. Indexes are assumed competence \u2014 the interviewer's fire is the concurrent purchase of the same seat."}]}, {"id": "p0c01-q13", "level": 2, "type": "mcq", "tag": "collaboration", "q": "Mid-design, the interviewer says: 'Interesting \u2014 but what about when the message queue itself falls over?' What are they most likely doing?", "options": [{"t": "Steering you toward a failure mode they want covered \u2014 follow the hint and explore it", "correct": true, "why": "Interviewer redirects are load-bearing. They're either rescuing you from a dead end or pointing at the signal they still need. Engaging genuinely earns collaboration points; brushing it off loses them."}, {"t": "Testing whether you'll defend your design under pressure", "correct": false, "why": "Occasionally they probe conviction, but the default read of a redirect is 'please go here.' Fighting hints is a documented failure pattern \u2014 pushing back against a hint costs real points."}, {"t": "Signaling the interview is going badly", "correct": false, "why": "Usually the opposite \u2014 probing questions mean they're engaged and collecting signal. Silence is the scary sound."}, {"t": "Filling time because you finished early", "correct": false, "why": "Failure-mode questions ARE the senior evaluation, not padding. This moment is the exam, arriving on schedule."}]}, {"id": "p0c01-q14", "level": 2, "type": "mcq", "tag": "ops", "q": "You have 3 minutes left and a complete design on the board. The strongest way to spend them:", "options": [{"t": "\"Quick ops pass: I'd watch p99 latency, error rate, and queue depth; alert on those; ship changes behind a flag region by region, with rollback being just flipping the flag off.\"", "correct": true, "why": "The thirty-second habit that closes the biggest senior gap. Monitoring + rollout + rollback, concretely named, converts 'good design' into 'design I'd be on call for.'"}, {"t": "Add two more caching layers to the diagram", "correct": false, "why": "Unrequested complexity in the final minutes reads as decoration. The unclaimed points are in operations, not more boxes."}, {"t": "Recap everything you already said", "correct": false, "why": "A pure recap adds zero new signal. A ten-second summary is fine \u2014 but spend the minutes on something not yet graded."}, {"t": "Ask the interviewer how you did", "correct": false, "why": "Puts them in an awkward spot and burns your closing window. Spend it demonstrating on-call thinking instead."}]}, {"id": "p0c01-q15", "level": 2, "type": "mcq", "tag": "requirements", "q": "Which non-functional requirement, stated early, does the most work in a chat-app design?", "options": [{"t": "\"Once the server acknowledges a message, it is never lost\"", "correct": true, "why": "This one sentence forces durable storage before acknowledgment, retries, and delivery guarantees \u2014 it generates half the architecture. That's what a load-bearing requirement looks like."}, {"t": "\"The UI should feel modern and clean\"", "correct": false, "why": "Real product concern, zero architectural consequence in this round. It shapes no backend decision."}, {"t": "\"The system should use microservices\"", "correct": false, "why": "An architecture choice cosplaying as a requirement. Requirements say what must be true; the design decides how. Starting from 'must use microservices' is backwards."}, {"t": "\"Code should be well-documented\"", "correct": false, "why": "Engineering hygiene, not a system property. It won't change a single box on the whiteboard."}]}, {"id": "p0c01-q16", "level": 2, "type": "mcq", "tag": "senior-bar", "q": "The interviewer asks 'why Redis over Memcached here?' The senior-reading answer is:", "options": [{"t": "\"I need the sorted-set structure for this leaderboard and persistence to survive restarts \u2014 that's Redis. For pure flat key-value caching, Memcached's simplicity would be fine.\"", "correct": true, "why": "Specific features tied to this design's needs, plus an honest statement of when the alternative wins. Opinion backed by mechanism is exactly what 'experience-based specificity' means."}, {"t": "\"Redis is more popular and better maintained.\"", "correct": false, "why": "Popularity is not a mechanism. This is name-dropping without familiarity \u2014 the pattern interviewers explicitly flag."}, {"t": "\"Either works; they're both in-memory caches.\"", "correct": false, "why": "Shrugging at a direct trade-off question is option-listing at its worst \u2014 the question was an invitation to show depth, declined."}, {"t": "\"Memcached is legacy; nobody chooses it now.\"", "correct": false, "why": "False (it still backs enormous fleets at Meta, among others) and dismissive \u2014 a confident wrong claim is worse than an honest gap."}]}, {"id": "p0c01-q17", "level": 3, "type": "mcq", "tag": "judgment", "q": "Two candidates answer the same feed-design question. A: flawless textbook coverage of push vs pull fanout, ending 'both approaches have merit.' B: rougher delivery, but commits \u2014 'push by default, pull above a million followers, because the read/write ratio is 20:1' \u2014 and volunteers 'my weak point is thundering herds when a celebrity posts; here's how I'd contain it.' Who gets the senior grade, and why?", "options": [{"t": "B \u2014 commitment with reasons plus self-identified weaknesses outweighs polish", "correct": true, "why": "B displays ownership: decides, ties the decision to a measured ratio, and critiques their own design unprompted \u2014 'proactively recognize limitations' is verbatim senior rubric. A knows things; B decides things."}, {"t": "A \u2014 completeness and accuracy are the foundation of the grade", "correct": false, "why": "A's knowledge is real but ends in 'both have merit' \u2014 the exact hedge that caps candidates at mid-level. Knowledge without commitment grades as a book report."}, {"t": "Both equally \u2014 they covered the same material", "correct": false, "why": "The rubric doesn't grade material covered; it grades judgment displayed. Same facts, different behaviors, different levels."}, {"t": "B, but only because admitting weakness earns honesty points", "correct": false, "why": "Partial credit: the self-critique matters, but as evidence of an owner's mindset \u2014 someone thinking about how their system fails \u2014 not as a virtue bonus. The commitment plus the reason does the heavy lifting."}]}, {"id": "p0c01-q18", "level": 3, "type": "mcq", "tag": "judgment", "q": "Designing an internal tool for 10,000 records updated a few times a day, a candidate proposes Elasticsearch, Kafka, and three service tiers 'for future scale.' The senior-calibrated alternative is:", "options": [{"t": "\"Load all 10K records into memory, refresh periodically, search with a linear scan \u2014 and here's the specific signal that would tell me to upgrade.\"", "correct": true, "why": "Ruthlessly cutting complexity, with a named escalation trigger, is a top-of-rubric senior behavior. 10K records is nothing; a linear scan wins. Simplicity chosen consciously and monitored reads as maturity."}, {"t": "The proposal is right \u2014 better to over-provision than migrate later", "correct": false, "why": "Complexity without justification reads as immaturity at the senior-plus bar. Every component is an on-call burden; buying three of them against imaginary load is a cost with no benefit."}, {"t": "Keep Elasticsearch but drop Kafka as a compromise", "correct": false, "why": "Half the over-engineering is still over-engineering. The workload fits in memory on one machine \u2014 the honest design acknowledges that."}, {"t": "Ask the interviewer whether future scale is in scope", "correct": false, "why": "Reasonable question, wrong crutch \u2014 the numbers already answered it. When the data speaks, deferring to the interviewer is the waiting-to-be-led pattern."}]}, {"id": "p0c01-q19", "level": 3, "type": "mcq", "tag": "judgment", "q": "Interviewer: 'Your design works. Now 100x the users.' Your database shards are suddenly hot. The strongest response pattern is:", "options": [{"t": "\"Good \u2014 here's what breaks first and in what order: the user-shard hot keys melt before the write path does. Short-term, cache in front; structurally, I'd reshard by a compound key. Trade-off: scatter-gather on some reads.\"", "correct": true, "why": "Naming the failure order, a containment move, a structural fix, and its cost \u2014 calmly, as if you expected the question \u2014 is precisely what the 100x push exists to elicit. Your design breaking IS the interview working."}, {"t": "\"The design already handles that \u2014 it's horizontally scalable.\"", "correct": false, "why": "Deflecting the stress test defends the design instead of exploring it. 'Horizontally scalable' as an incantation, without naming what actually breaks, is a buzzword shield \u2014 and interviewers push through it."}, {"t": "\"I'd move everything to a managed cloud service that handles scale.\"", "correct": false, "why": "Outsourcing the question isn't answering it. Managed services move the problem; the interviewer wants to see you reason about the hot-key mechanics wherever they live."}, {"t": "Start the design over with a bigger architecture", "correct": false, "why": "Throwing away a working design under pressure reads as panic. Evolve it: contain, then restructure, naming costs. Iteration under fire is the graded skill."}]}, {"id": "p0c01-q20", "level": 3, "type": "mcq", "tag": "judgment", "q": "Which closing statement converts a good performance into a senior one?", "options": [{"t": "\"Before we wrap: I'd monitor p99 feed latency, fanout queue depth, and cache hit rate \u2014 queue depth is my early-warning signal. I'd ship the fanout change behind a flag to 1% of users first. And the piece I'd redesign first at 10x is the notification path.\"", "correct": true, "why": "Ops instrumentation for THIS design, a safe rollout plan, and a self-identified weak point \u2014 three senior signals in twenty seconds, all unprompted. This closing alone can move a grade."}, {"t": "\"So that's my design \u2014 happy to go deeper anywhere you'd like.\"", "correct": false, "why": "Polite, passive, and empty-handed. It hands your remaining signal-generation time back to the interviewer \u2014 the waiting-to-be-led pattern in miniature."}, {"t": "\"This is similar to how Instagram actually does it, so it's battle-tested.\"", "correct": false, "why": "Borrowed authority isn't judgment. The interviewer graded your reasoning, not Instagram's \u2014 and claiming their architecture invites probes you may not survive."}, {"t": "\"With more time I'd add multi-region failover, GraphQL, and a service mesh.\"", "correct": false, "why": "A wishlist of unjustified complexity as a closing note reads as decoration, not judgment. One weak point named honestly beats three technologies named ambitiously."}]}, {"id": "p0c01-q21", "level": 3, "type": "mcq", "tag": "judgment", "q": "A candidate opens the deep-dive phase with: 'The interesting problem here is the write path under contention \u2014 I want to spend our remaining time there. The read path is standard caching, which I'm happy to sketch but not dwell on.' What did they just do?", "options": [{"t": "Claimed the driver's seat and triaged by difficulty \u2014 the two clearest senior behaviors, in one sentence", "correct": true, "why": "They proposed the agenda (driving), identified the crux (triage), and consciously deprioritized the routine part while showing they know it's there. This single sentence pattern is trainable and worth practicing verbatim."}, {"t": "Took a dangerous gamble \u2014 the interviewer might have wanted the read path", "correct": false, "why": "It's a soft claim, not a decree \u2014 any interviewer who wants the read path will simply say so, and following that steer costs nothing. The expected value of proposing an agenda is strongly positive; passivity has no upside."}, {"t": "Showed off \u2014 announcing what's 'standard' sounds arrogant", "correct": false, "why": "Tone matters, but classifying problems by difficulty is the job. 'This part is routine, that part is hard' is engineering triage, and stated matter-of-factly it reads as calibration, not arrogance."}, {"t": "Wasted time on meta-commentary instead of designing", "correct": false, "why": "Ten seconds of agenda-setting multiplies the value of the next fifteen minutes and is itself graded behavior \u2014 the interviewer literally scores who drives."}]}, {"id": "p0c01-q22", "level": 3, "type": "mcq", "tag": "judgment", "q": "Honest self-assessment: you realize mid-interview that the component you're deep-diving is one you've never actually operated. The senior move is:", "options": [{"t": "Flag it and reason from first principles out loud: \"I haven't run Cassandra in production \u2014 reasoning from its design: writes are cheap, reads may need tuning, so I'd validate my read-path assumptions first.\"", "correct": true, "why": "Playing to strengths while flagging what you don't know is explicit rubric language. First-principles reasoning from an honest base earns more than fluent recitation \u2014 and infinitely more than a bluff that collapses under one probe."}, {"t": "Bluff through it \u2014 admitting gaps at a senior interview is fatal", "correct": false, "why": "Backwards. One probing follow-up exposes the bluff and poisons trust in everything else you've said. Interviewers report honest gaps as neutral-to-positive; discovered bluffs as terminal."}, {"t": "Immediately pivot the deep dive to a component you know better", "correct": false, "why": "A visible flinch \u2014 and it wastes the setup you've built. Often the honest first-principles path through the current component is stronger than a jarring pivot. (Choosing familiar ground BEFORE diving is smart; fleeing mid-dive is not.)"}, {"t": "Ask the interviewer to pick a different area", "correct": false, "why": "Hands them the wheel at the worst moment. You can redirect yourself if needed \u2014 outsourcing the rescue is the passivity pattern again."}]}]}</script>
<script>
'use strict';
/* ===== HLD Gym engine ===== */

const TOC = JSON.parse(document.getElementById('toc-data').textContent);
const QUIZ = JSON.parse(document.getElementById('quiz-data').textContent); // {chapterId: [items]}

/* ---------- state ---------- */
const KEY = 'hldgym_v1';
const DAY = 86400000;
const INTERVALS = [0, 1, 3, 7, 14, 30]; // days per Leitner box 1..5 (index 1..5)
const RANKS = [
  ['Intern', 0], ['Junior', 500], ['Mid-level', 1500],
  ['Senior', 3500], ['Staff', 7000], ['Distinguished', 12000],
];

function blank() {
  return {
    theme: null, xp: 0,
    streak: 0, lastDay: null, freezesUsed: 0, freezeWeek: null,
    items: {},      // itemId -> {box, due, right, wrong}
    levels: {},     // chapterId -> {1: best%, 2: best%, 3: best%}
    feynman: {},    // key -> text
    boss: {},       // part -> {best, passed}
    heat: {},       // 'YYYY-MM-DD' -> count
    lastCh: null,
  };
}
let S = blank();
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => localStorage.setItem(KEY, JSON.stringify(S));

const today = () => new Date().toISOString().slice(0, 10);
const dayNum = iso => Math.floor(Date.parse(iso) / DAY);

/* ---------- toc helpers ---------- */
const CHAPTERS = [];
TOC.parts.forEach(p => p.chapters.forEach((c, i) => CHAPTERS.push({ ...c, part: p.n, idx: i + 1, partTitle: p.title })));
const chById = id => CHAPTERS.find(c => c.id === id);
const isReady = id => !!document.querySelector(`template[data-ch="${id}"]`);
const chQuiz = id => QUIZ[id] || [];
const mastered = id => (S.levels[id] || {})[3] >= 80;

/* ---------- xp, rank, streak ---------- */
function rank() {
  let r = RANKS[0][0], next = null;
  for (let i = 0; i < RANKS.length; i++) {
    if (S.xp >= RANKS[i][1]) r = RANKS[i][0];
    else { next = RANKS[i]; break; }
  }
  return { name: r, next };
}
function addXP(n, label) {
  S.xp += n; save();
  toast(`+${n} XP${label ? ' · ' + label : ''}`);
  renderChrome();
}
function touchStreak() {
  const t = today();
  if (S.lastDay === t) return;
  // weekly freeze reset (ISO week key)
  const wk = (d => { const dt = new Date(d); dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7)); return dt.toISOString().slice(0, 10); })(t);
  if (S.freezeWeek !== wk) { S.freezeWeek = wk; S.freezesUsed = 0; }
  if (S.lastDay) {
    const gap = dayNum(t) - dayNum(S.lastDay) - 1; // fully missed days
    if (gap > 0) {
      const freezes = Math.min(gap, 2 - S.freezesUsed);
      if (freezes >= gap) { S.freezesUsed += gap; toast(`🧊 streak freeze used (${gap})`); }
      else S.streak = 0;
    }
  }
  S.streak += 1; S.lastDay = t;
  S.heat[t] = S.heat[t] || 0;
  save(); renderChrome();
}
function bumpHeat() { const t = today(); S.heat[t] = (S.heat[t] || 0) + 1; }

/* ---------- leitner ---------- */
function gradeItem(itemId, correct) {
  const it = S.items[itemId] || { box: 0, due: null, right: 0, wrong: 0 };
  if (correct) { it.right++; it.box = Math.min(5, (it.box || 0) + 1); }
  else { it.wrong++; it.box = 1; }
  it.due = new Date(Date.now() + INTERVALS[it.box] * DAY).toISOString().slice(0, 10);
  S.items[itemId] = it;
  bumpHeat(); touchStreak(); save();
}
function dueItems() {
  const t = today(), out = [];
  for (const [chId, items] of Object.entries(QUIZ)) {
    if (!isReady(chId)) continue;
    for (const q of items) {
      const st = S.items[q.id];
      if (st && st.due && st.due <= t) out.push({ ...q, chapter: chId });
    }
  }
  return out.sort(() => Math.random() - 0.5);
}

/* ---------- chrome ---------- */
const $ = sel => document.querySelector(sel);
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}
function renderChrome() {
  $('#streak-pill').innerHTML = `🔥 <b>${S.streak}</b>d · ${S.xp} XP`;
  renderSidebar();
}
function renderSidebar() {
  const cur = location.hash.replace('#ch/', '');
  let html = '';
  for (const p of TOC.parts) {
    const done = p.chapters.filter(c => mastered(c.id)).length;
    html += `<div class="side-part"><div class="side-part-title">Part ${p.n} — ${p.title}<span class="prog">${done}/${p.chapters.length}</span></div>`;
    p.chapters.forEach((c, i) => {
      const ready = isReady(c.id);
      const cls = ['side-ch', ready ? '' : 'soon', cur === c.id ? 'active' : ''].join(' ');
      const mark = mastered(c.id) ? '<span class="m done">✔</span>' : '';
      html += `<a class="${cls}" href="#ch/${c.id}"><span class="n">${p.n}.${i + 1}</span><span>${c.title}</span>${mark}</a>`;
    });
    html += `</div>`;
  }
  $('#sidebar').innerHTML = html;
}

/* ---------- quiz rendering ---------- */
function renderQuizItem(q, onAnswer, num) {
  const wrap = document.createElement('div');
  wrap.className = 'q-item';
  wrap.innerHTML = `<div class="q-num">${num || ''}${q.tag ? ' · ' + q.tag : ''} · L${q.level}</div>
    <div class="q-text"></div>`;
  wrap.querySelector('.q-text').textContent = q.q;
  const multi = q.type === 'multi';
  const chosen = new Set();
  const correctSet = new Set(q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0));

  const buttons = q.options.map((o, i) => {
    const b = document.createElement('button');
    b.className = 'q-opt'; b.type = 'button'; b.textContent = o.t;
    b.addEventListener('click', () => {
      if (multi) {
        // multi: toggle until submit
        if (chosen.has(i)) { chosen.delete(i); b.style.borderColor = ''; }
        else { chosen.add(i); b.style.borderColor = 'var(--accent)'; }
        return;
      }
      finish(new Set([i]));
    });
    wrap.appendChild(b);
    return b;
  });

  let submit = null;
  if (multi) {
    submit = document.createElement('button');
    submit.className = 'btn ghost'; submit.type = 'button'; submit.textContent = 'Check my picks';
    submit.addEventListener('click', () => { if (chosen.size) finish(chosen); });
    wrap.appendChild(submit);
  }

  function whyPanel(opt, ok, picked) {
    const d = document.createElement('div');
    d.className = 'q-why ' + (ok ? 'right' : 'wrong');
    d.innerHTML = `<b class="verdict">${ok ? (picked ? '✔ Correct' : 'The right answer') : '✘ Not this one'}</b>`;
    const p = document.createElement('span'); p.textContent = opt.why; d.appendChild(p);
    return d;
  }

  function finish(picks) {
    const correct = picks.size === correctSet.size && [...picks].every(i => correctSet.has(i));
    buttons.forEach(b => b.disabled = true);
    if (submit) submit.remove();
    q.options.forEach((o, i) => {
      const b = buttons[i];
      if (picks.has(i)) {
        b.classList.add(o.correct ? 'picked-right' : 'picked-wrong');
        b.insertAdjacentElement('afterend', whyPanel(o, o.correct, true));
      } else if (o.correct) {
        b.classList.add('reveal-right');
        b.insertAdjacentElement('afterend', whyPanel(o, true, false));
      }
    });
    onAnswer(correct);
  }
  return wrap;
}

/* ---------- views ---------- */
const VIEW = $('#view');

function renderHome() {
  const due = dueItems().length;
  const done = CHAPTERS.filter(c => mastered(c.id)).length;
  const readyCount = CHAPTERS.filter(c => isReady(c.id)).length;
  const r = rank();
  const cont = S.lastCh && isReady(S.lastCh) ? chById(S.lastCh) : CHAPTERS.find(c => isReady(c.id) && !mastered(c.id));
  let html = `<div class="content">
    <p class="eyebrow">Training floor</p>
    <h1 class="ch-title">Welcome back.</h1>
    <div class="tiles">
      <div class="tile accent"><div class="tile-label">Rank</div><div class="tile-value">${r.name}</div>
        <div class="tile-label">${r.next ? (r.next[1] - S.xp) + ' xp to ' + r.next[0] : 'max rank'}</div></div>
      <div class="tile"><div class="tile-label">XP</div><div class="tile-value">${S.xp}</div></div>
      <div class="tile warm"><div class="tile-label">Streak</div><div class="tile-value">${S.streak}<small> days</small></div></div>
      <div class="tile"><div class="tile-label">Mastered</div><div class="tile-value">${done}<small> / ${CHAPTERS.length}</small></div></div>
    </div>
    <p>
      ${cont ? `<a class="btn" href="#ch/${cont.id}">Continue: ${cont.title}</a>` : ''}
      <a class="btn ghost" href="#review">Review due · ${due}</a>
    </p>
    <h2 style="margin-top:2em">Review activity</h2>
    <div class="heat" aria-label="review activity heatmap">${heatCells()}</div>
    <div class="heat-cap">last 15 weeks · darker = more answers</div>`;

  for (const p of TOC.parts) {
    const boss = S.boss[p.n];
    const partReady = p.chapters.some(c => isReady(c.id));
    html += `<div class="part-block">
      <div class="part-head"><h2>Part ${p.n} — ${p.title}</h2><span class="tagline">${p.tagline}</span>
      ${partReady ? `<a class="btn ghost bossbtn" href="#boss/${p.n}">${boss?.passed ? '👑 Boss cleared' : 'Boss battle'}</a>` : ''}</div>
      <div class="ch-grid">`;
    p.chapters.forEach((c, i) => {
      const ready = isReady(c.id);
      const st = mastered(c.id) ? '<span class="st done">✔</span>'
        : (S.levels[c.id] ? '<span class="st part">◐</span>' : '');
      html += `<a class="ch-cell ${ready ? '' : 'soon'}" href="#ch/${c.id}"><span class="n">${p.n}.${i + 1}</span><span>${c.title}${ready ? '' : ' <small>(soon)</small>'}</span>${st}</a>`;
    });
    html += `</div></div>`;
  }
  html += `<div class="part-block"><h2>Backup</h2>
    <p style="font-size:.9rem;color:var(--ink-2)">Progress lives in this browser. Copy the blob to move it to another device.</p>
    <p><button class="btn ghost" id="exp">Export progress</button> <button class="btn ghost" id="imp">Import</button></p>
    <textarea id="expbox" style="width:100%;min-height:70px;display:none;font-size:.75rem"></textarea></div></div>`;
  VIEW.innerHTML = html;
  $('#exp').onclick = () => { const b = $('#expbox'); b.style.display = 'block'; b.value = JSON.stringify(S); b.select(); };
  $('#imp').onclick = () => {
    const b = $('#expbox'); b.style.display = 'block';
    if (!b.value.trim()) { b.placeholder = 'Paste your exported blob here, then press Import again.'; b.focus(); return; }
    try { S = Object.assign(blank(), JSON.parse(b.value)); save(); toast('Progress imported'); route(); }
    catch (e) { toast('That blob did not parse'); }
  };
}

function heatCells() {
  const cells = [];
  const now = new Date();
  const start = new Date(now - 104 * DAY);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7)); // align Monday
  for (let d = new Date(start); d <= now; d.setDate(d.getDate() + 1)) {
    const k = d.toISOString().slice(0, 10);
    const v = S.heat[k] || 0;
    const l = v === 0 ? '' : v < 5 ? 'l1' : v < 15 ? 'l2' : v < 30 ? 'l3' : 'l4';
    cells.push(`<i class="${l}" title="${k}: ${v}"></i>`);
  }
  return cells.join('');
}

function renderChapter(id) {
  const c = chById(id);
  const tpl = document.querySelector(`template[data-ch="${id}"]`);
  if (!c || !tpl) { VIEW.innerHTML = `<div class="content"><h1 class="ch-title">Coming soon</h1><p>This chapter isn't written yet.</p></div>`; return; }
  S.lastCh = id; save();

  const words = tpl.content.textContent.split(/\s+/).length;
  VIEW.innerHTML = `<div class="content">
    <p class="eyebrow">Part ${c.part} — ${c.partTitle}</p>
    <h1 class="ch-title">${c.title} ${mastered(id) ? '<span class="stamp">Mastered</span>' : ''}</h1>
    <div class="ch-meta">${c.part}.${c.idx} · ~${Math.max(1, Math.round(words / 220))} min read · ${chQuiz(id).length} quiz questions</div>
    <div class="ch-body"></div>
    <div class="quiz-wrap"><h2>Quiz</h2><p style="font-size:.9rem;color:var(--ink-2)">Three levels. Pass Level 3 with 80% to earn the stamp. Answers go into your review queue.</p>
    <div class="q-level-tabs"></div><div class="q-zone"></div></div>
    <div class="ch-nav"></div>
  </div>`;
  VIEW.querySelector('.ch-body').appendChild(tpl.content.cloneNode(true));

  // feynman blocks
  VIEW.querySelectorAll('.feynman').forEach(f => {
    const key = f.dataset.key;
    const ta = document.createElement('textarea');
    ta.placeholder = 'Write it in your own words. Out loud is even better.';
    ta.value = S.feynman[key] || '';
    ta.addEventListener('input', () => { S.feynman[key] = ta.value; save(); });
    const hint = document.createElement('div');
    hint.className = 'fey-hint';
    hint.textContent = 'Saved automatically. Jargon you can’t avoid = a gap you just found.';
    const model = f.querySelector('.fey-model');
    f.insertBefore(ta, model); f.insertBefore(hint, model);
  });

  // quiz levels
  const items = chQuiz(id);
  const tabs = VIEW.querySelector('.q-level-tabs');
  const zone = VIEW.querySelector('.q-zone');
  const levels = [1, 2, 3];
  const names = { 1: 'Level 1 · Recall', 2: 'Level 2 · Apply', 3: 'Level 3 · Senior bar' };
  function openLevel(lv) {
    tabs.querySelectorAll('.q-level-tab').forEach(t => t.classList.toggle('active', +t.dataset.lv === lv));
    zone.innerHTML = '';
    const qs = items.filter(q => q.level === lv);
    if (!qs.length) { zone.innerHTML = '<p>No questions at this level yet.</p>'; return; }
    let answered = 0, correct = 0;
    const firstTry = {};
    qs.forEach((q, i) => {
      zone.appendChild(renderQuizItem(q, ok => {
        answered++; if (ok) correct++;
        if (firstTry[q.id] === undefined) {
          firstTry[q.id] = ok;
          if (ok) addXP(lv === 1 ? 10 : lv === 2 ? 15 : 20);
        }
        gradeItem(q.id, ok);
        if (answered === qs.length) levelDone();
      }, `Q${i + 1}/${qs.length}`));
    });
    function levelDone() {
      const pct = Math.round(100 * correct / qs.length);
      const best = (S.levels[id] = S.levels[id] || {});
      const prev = best[lv] || 0;
      best[lv] = Math.max(prev, pct); save();
      const pass = lv === 3 && pct >= 80;
      const sum = document.createElement('div');
      sum.className = 'q-summary' + (pct >= 80 ? ' pass' : '');
      sum.innerHTML = `<b>${pct}%</b> (${correct}/${qs.length}) — best ${best[lv]}%. ` +
        (pass && prev < 80 ? '<span class="stamp big">Mastered</span> Chapter stamped. It’s yours now — reviews will keep it that way.'
          : pct >= 80 ? 'Strong.' : 'Below 80 — reread the sections you missed, the queue will bring these back.');
      zone.appendChild(sum);
      if (pass && prev < 80) { addXP(50, 'chapter mastered'); renderChrome(); }
      sum.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
  levels.forEach(lv => {
    const b = document.createElement('button');
    b.className = 'q-level-tab'; b.dataset.lv = lv;
    const best = (S.levels[id] || {})[lv];
    b.innerHTML = names[lv] + (best !== undefined ? ` <span class="score">${best}%</span>` : '');
    b.onclick = () => openLevel(lv);
    tabs.appendChild(b);
  });
  openLevel(1);

  // prev/next
  const i = CHAPTERS.indexOf(chById(id));
  const prev = CHAPTERS.slice(0, i).reverse().find(c2 => isReady(c2.id));
  const next = CHAPTERS.slice(i + 1).find(c2 => isReady(c2.id));
  VIEW.querySelector('.ch-nav').innerHTML =
    (prev ? `<a class="btn ghost" href="#ch/${prev.id}">← ${prev.title}</a>` : '<span></span>') +
    (next ? `<a class="btn" href="#ch/${next.id}">${next.title} →</a>` : '');
  window.scrollTo(0, 0);
}

function renderReview() {
  const due = dueItems();
  VIEW.innerHTML = `<div class="content"><p class="eyebrow">Spaced review</p>
    <h1 class="ch-title">Review queue</h1>
    <p>${due.length ? due.length + ' answers are due. Old chapters, mixed together on purpose — that’s what makes it stick.' : 'Nothing due. Go learn something new, or come back tomorrow.'}</p>
    <div class="q-zone"></div></div>`;
  const zone = VIEW.querySelector('.q-zone');
  let i = 0, right = 0;
  function nextItem() {
    zone.innerHTML = '';
    if (i >= due.length) {
      if (due.length) zone.innerHTML = `<div class="q-summary pass"><b>${right}/${due.length}</b> — queue cleared. See you when the next batch is due.</div>`;
      return;
    }
    const q = due[i];
    const ch = chById(q.chapter);
    const head = document.createElement('div');
    head.className = 'review-item-tag';
    head.textContent = `${i + 1}/${due.length} · from ${ch ? ch.title : q.chapter}`;
    zone.appendChild(head);
    zone.appendChild(renderQuizItem(q, ok => {
      gradeItem(q.id, ok);
      if (ok) { right++; addXP(5); }
      i++;
      setTimeout(nextItem, ok ? 900 : 2600);
    }));
  }
  nextItem();
}

function renderBoss(part) {
  const p = TOC.parts.find(x => x.n === +part);
  if (!p) { location.hash = '#home'; return; }
  const pool = p.chapters.filter(c => isReady(c.id)).flatMap(c => chQuiz(c.id));
  const hard = pool.filter(q => q.level >= 2);
  const qs = (hard.length >= 20 ? hard : pool).sort(() => Math.random() - 0.5).slice(0, 20);
  const best = S.boss[part]?.best;
  VIEW.innerHTML = `<div class="content"><p class="eyebrow">Part ${p.n} — ${p.title}</p>
    <h1 class="ch-title">Boss battle</h1>
    <p>${qs.length} questions sampled from the whole part. 25 minutes on the clock (it won’t stop you — it’s telling you the truth about interview pace). Pass at 80%.${best !== undefined ? ` Best so far: <b>${best}%</b>.` : ''}</p>
    <p><button class="btn" id="start">Enter the arena</button></p>
    <div class="timer" id="timer" hidden></div><div class="q-zone"></div></div>`;
  const zone = VIEW.querySelector('.q-zone');
  $('#start').onclick = () => {
    $('#start').remove();
    const t0 = Date.now(); const timerEl = $('#timer'); timerEl.hidden = false;
    const tick = setInterval(() => {
      const left = 25 * 60 - Math.floor((Date.now() - t0) / 1000);
      timerEl.textContent = `⏱ ${left >= 0 ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'over time — keep going'}`;
      if (left < 0) timerEl.style.color = 'var(--bad)';
    }, 1000);
    let answered = 0, right = 0;
    qs.forEach((q, i) => zone.appendChild(renderQuizItem(q, ok => {
      answered++; if (ok) right++;
      gradeItem(q.id, ok);
      if (answered === qs.length) {
        clearInterval(tick);
        const pct = Math.round(100 * right / qs.length);
        const rec = S.boss[part] = S.boss[part] || {};
        const firstPass = pct >= 80 && !rec.passed;
        rec.best = Math.max(rec.best || 0, pct); if (pct >= 80) rec.passed = true; save();
        const sum = document.createElement('div');
        sum.className = 'q-summary' + (pct >= 80 ? ' pass' : '');
        sum.innerHTML = pct >= 80 ? `<b>${pct}%</b> — boss down. <span class="stamp big">Part ${p.n} cleared</span>` : `<b>${pct}%</b> — the boss wins this round. Check the review queue and come back.`;
        zone.appendChild(sum);
        if (firstPass) addXP(200, `Part ${p.n} boss`);
        sum.scrollIntoView({ behavior: 'smooth' });
      }
    }, `Q${i + 1}/${qs.length}`)));
  };
}

/* ---------- router + boot ---------- */
function route() {
  const h = location.hash || '#home';
  $('#sidebar').classList.remove('open'); $('#scrim').hidden = true;
  if (h.startsWith('#ch/')) renderChapter(h.slice(4));
  else if (h === '#review') renderReview();
  else if (h.startsWith('#boss/')) renderBoss(h.slice(6));
  else renderHome();
  renderSidebar();
}
window.addEventListener('hashchange', route);

$('#theme-toggle').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  S.theme = next; save();
});
$('#nav-toggle').addEventListener('click', () => {
  const sb = $('#sidebar');
  sb.classList.toggle('open');
  $('#scrim').hidden = !sb.classList.contains('open');
});
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').hidden = true; });

renderChrome();
route();

</script>
</body>
</html>
